<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101634">
<title>ちいさな花火大会</title><meta name="description" content="夜空をタッチして、自分だけの花火大会。親子で遊べる小さな花火あそび。">
<link rel="icon" href="./assets/favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css">
</head>
<body>
<main id="festival" aria-label="ちいさな花火大会">
<img class="scenery" src="./assets/scenery.svg" alt=""><canvas id="sky" aria-label="夜空をタッチすると花火が上がります"></canvas>
<div id="audience" aria-label="花火を見ている動物たち"></div>
<div class="brand" aria-hidden="true">ちいさな花火大会 <span>✦</span></div>
<button id="sound" class="sound" aria-label="音を消す" aria-pressed="false" hidden></button>
<section id="welcome"><div class="intro"><p class="eyebrow">おそらに、ぱっと。</p><h1>ちいさな<br><span>花火大会</span></h1><p class="subtitle">きみのゆびから、ひかりがひろがる。</p><button id="start"><span aria-hidden="true">▶</span> はじめる</button><p class="sound-note">♪ おとが でるよ</p></div></section>
<div id="hint" hidden>おそらを タッチしてね <span>✧</span></div>
<div id="rotate"><div class="phone" aria-hidden="true">↻</div><p>よこにして あそぼう</p><span>おそらが ひろくなるよ</span></div>
</main><script type="module" src="./game.js"></script>
</body></html>
